name: API Pipeline

on:
  schedule:
    - cron: '0 21 * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        shell: bash
        env:
          API_AUTHENTICATED_USERNAME: ${{ secrets.API_AUTHENTICATED_USERNAME }}
          API_AUTHENTICATED_USER_PASSWORD: ${{ secrets.API_AUTHENTICATED_USER_PASSWORD }}
        run: |
          if [ -z "$API_AUTHENTICATED_USERNAME" ]; then
            echo "Missing required secret: API_AUTHENTICATED_USERNAME"
            exit 1
          fi

          if [ -z "$API_AUTHENTICATED_USER_PASSWORD" ]; then
            echo "Missing required secret: API_AUTHENTICATED_USER_PASSWORD"
            exit 1
          fi

      - name: Run API tests
        env:
          TEST_ENV: dev
          API_AUTHENTICATED_USERNAME: ${{ secrets.API_AUTHENTICATED_USERNAME }}
          API_AUTHENTICATED_USER_PASSWORD: ${{ secrets.API_AUTHENTICATED_USER_PASSWORD }}

        run: npm run test:api

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: reports/allure-report
          retention-days: 7

  allure-report-api:
    needs: api-tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: api-allure-report
          path: gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
